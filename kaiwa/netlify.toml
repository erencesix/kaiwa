[build]
  publish = "public"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/api/analyze"
  function = "analyze"

[[edge_functions]]
  path = "/api/transcribe"
  function = "transcribe"
  timeout = 120

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
