[build]
  publish = "public"
  functions = "functions"
  edge_functions = "netlify/edge-functions"

# analyze is now an Edge Function — no timeout wall, streaming GPT-4o
[[edge_functions]]
  path = "/api/analyze"
  function = "analyze"

[[edge_functions]]
  path = "/api/transcribe"
  function = "transcribe"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
